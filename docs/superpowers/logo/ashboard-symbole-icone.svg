      <stop offset="0" stop-color="#3A3C44"/>
      <stop offset="1" stop-color="#17181C"/>
    </linearGradient>
    <linearGradient id="liseré" gradientUnits="userSpaceOnUse" x1="128" y1="32" x2="128" y2="224">
      <stop offset="0" stop-color="#5A5D66"/>
      <stop offset="1" stop-color="#26272D"/>
    </linearGradient>
