      <stop offset="0" stop-color="#E8401C"/>
      <stop offset="0.5" stop-color="#FFB04A"/>
      <stop offset="1" stop-color="#E8401C"/>
    </linearGradient>
  </defs>
  <path fill="url(#liseré)" d="M96 32 H160 C205 32 224 51 224 96 V160 C224 205 205 224 160 224 H96 C51 224 32 205 32 160 V96 C32 51 51 32 96 32 Z"/>
  <path fill="url(#charbon)" d="M96 35 H160 C203 35 221 53 221 96 V160 C221 203 203 221 160 221 H96 C53 221 35 203 35 160 V96 C35 53 53 35 96 35 Z"/>
  <path fill="url(#braise)" d="M56 124 C96 100 160 100 200 124 C160 148 96 148 56 124 Z"/>
